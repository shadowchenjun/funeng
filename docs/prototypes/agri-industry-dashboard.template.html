<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 30%,#1c3a2b55,transparent 65%),var(--bg);color:var(--text);font:14px 'PingFang SC','Microsoft YaHei',sans-serif}button,select{font:inherit;color:inherit}button,a,select{outline-offset:4px}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--green)}button{cursor:pointer;background:none;border:0}a{color:var(--cyan)}[hidden]{display:none!important}main{max-width:1800px;margin:auto;padding:28px 32px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;padding-bottom:23px;border-bottom:1px solid var(--line)}.brand{font-size:18px;letter-spacing:3px}.brand small,.eyebrow{display:block;color:var(--dim);font:10px Menlo,monospace;letter-spacing:2px;margin-top:8px}h1{font-size:28px;font-weight:550;letter-spacing:5px;margin:0}h2{font-size:15px;font-weight:550;margin:0 0 18px}h2:before{content:'';display:inline-block;width:3px;height:13px;background:var(--green);margin-right:10px}h3{font-size:14px;margin:0 0 10px}.actions{display:flex;gap:8px}.quiet,select{border:1px solid var(--line);border-radius:5px;padding:9px 12px;background:#10231b}.quiet:hover{border-color:var(--cyan)}nav{display:flex;gap:6px;margin:20px 0;flex-wrap:wrap}nav button{padding:12px 20px;border-radius:5px;color:var(--dim)}nav button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--green);color:#18251b}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:20px}.pagehead h2{font-size:23px;letter-spacing:2px;margin-bottom:9px}.pagehead h2:before{display:none}.pagehead p,.note{font-size:12px;line-height:1.8;color:var(--dim);margin:0}.badge{color:var(--cyan);border:1px solid #3f5f50;border-radius:20px;padding:6px 12px;white-space:nowrap;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat,.panel{background:linear-gradient(130deg,#14291faa,#0e1d18);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0}.stat .label{font-size:12px;color:var(--dim)}.value{font:34px 'Avenir Next',Menlo,sans-serif;color:var(--green);margin:8px 0;letter-spacing:-.5px}.value small{font:11px 'PingFang SC',sans-serif;color:var(--dim);margin-left:7px;letter-spacing:0}.meta{font-size:10px;color:var(--dim);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}.span8{grid-column:span 8}.span7{grid-column:span 7}.span5{grid-column:span 5}.span4{grid-column:span 4}.span6{grid-column:span 6}.span12{grid-column:span 12}.map{width:100%;height:380px;display:block}.province{fill:#18362a;stroke:#46725a;stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}.province:hover,.province:focus{stroke:var(--green);stroke-width:2;outline:none}.province.selected{stroke:var(--orange);stroke-width:2.5}.legend{display:flex;justify-content:center;gap:14px;color:var(--dim);font-size:10px;margin:8px 0 14px}.legend i{display:inline-block;width:40px;height:7px;margin-right:6px;background:linear-gradient(90deg,#254b33,#c3df87)}.mapdetail{border-top:1px solid var(--line);padding-top:12px;color:var(--cyan);font-size:12px}.barrow{display:grid;grid-template-columns:88px 1fr 102px;gap:12px;align-items:center;margin:18px 0;font-size:12px}.barrow .track{height:7px;background:#263c30;border-radius:2px;overflow:hidden}.barrow .fill{height:100%;background:var(--cyan)}.barrow .number{font:12px Menlo,monospace;text-align:right}.barrow .number small{display:block;color:var(--dim);font:10px 'PingFang SC',sans-serif;margin-top:5px}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 18px}.filters label{color:var(--dim);font-size:12px}.tablewrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:5px}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{padding:12px 14px;border-bottom:1px solid #294034;text-align:left}th{color:var(--dim);font-weight:400;position:sticky;top:0;background:#162c21}td:first-child{position:sticky;left:0;background:#10231b}td:last-child{text-align:right}.empty{padding:35px;text-align:center;color:var(--dim)}.listrow{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border:0}.listrow strong{font-weight:500;font-size:13px}.listrow p{font-size:11px;color:var(--dim);line-height:1.8;margin:7px 0 0}.listrow .tag{font-size:11px;color:var(--cyan);white-space:nowrap}.seg{display:flex;gap:7px;margin-bottom:20px}.seg button{padding:10px 16px;border:1px solid var(--line);border-radius:5px;color:var(--dim)}.callout{border-left:2px solid var(--orange);padding:12px 15px;background:#b7923510;color:#ceb989;font-size:12px;line-height:1.8;margin:18px 0}.pending .value{color:#83988a;font-size:24px;letter-spacing:1px}.workflow{display:flex;gap:12px;margin:12px 0 20px;align-items:center;flex-wrap:wrap}.workflow span{padding:16px;background:#1b3325;border:1px solid var(--line);border-radius:5px;font-size:12px}.workflow b{color:var(--dim);font-weight:400}.iframe{width:100%;height:1120px;border:1px solid var(--line);border-radius:8px}.source{padding:16px;border:1px solid var(--line);border-radius:6px;margin:10px 0}.source p{color:var(--dim);font-size:12px;line-height:1.8}.source a{font-size:12px}.modal{width:min(900px,95vw);max-height:85dvh;overflow:auto;background:#10231b;color:var(--text);border:1px solid #53724d;border-radius:8px;padding:25px}.modal::backdrop{background:#03100cd9}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalhead button{font-size:25px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:13px 20px;background:#284a2c;border:1px solid var(--green);border-radius:6px;z-index:5}.footer{display:flex;justify-content:space-between;gap:16px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:10px;color:var(--dim);line-height:1.8}.accent{color:var(--cyan)}.quality .fill{background:var(--green)}
@media(max-width:1100px){header{flex-wrap:wrap}h1{font-size:23px}.brand{flex:1}.span8,.span7,.span5,.span4{grid-column:span 6}.barrow{grid-template-columns:80px 1fr 90px}}
@media(max-width:720px){main{padding:18px 14px}header{gap:15px}h1{order:3;width:100%;font-size:24px}.brand{font-size:12px;letter-spacing:1px}.actions .quiet{font-size:11px;padding:8px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.value{font-size:26px}.stat,.panel{padding:16px}nav{gap:4px}nav button{font-size:12px;padding:11px 12px}.pagehead{flex-wrap:wrap;gap:10px}.pagehead h2{font-size:20px}.grid>section{grid-column:span 12}.map{height:290px}.filters select{max-width:200px}.footer{flex-direction:column}.iframe{height:1600px}.barrow{grid-template-columns:85px 1fr 85px;gap:8px}}

</head><body>
<main>
<header><div class="brand">◒　赋能 · 产业数据<small>FUNENG / AGRICULTURE OBSERVATORY</small></div><h1>农业产业驾驶舱</h1><div class="actions"><button class="quiet" id="source-open">数据口径与来源</button><button class="quiet" id="export">导出当前数据</button></div></header>
<nav aria-label="产业驾驶舱页面" id="nav"></nav>
<div class="pagehead"><div><h2 id="page-title"></h2><p id="page-desc"></p></div><span class="badge">公开数据快照 · 2026.10.01</span></div>
<div class="filters" id="filters" hidden><label for="metric">产业指标</label><select id="metric"></select><label for="region">地区</label><select id="region"></select><button class="quiet" id="reset">恢复全国视图</button></div>
<div class="seg" id="finance-seg" hidden><button data-mode="public" aria-pressed="true">涉农金融背景</button><button data-mode="platform" aria-pressed="false">平台融资运营 · 待接入</button></div>
<div id="content"></div>
<footer class="footer"><span>本地设计原型 · 年度、季度、日报各自标注统计期 · 无数据保留待接入状态</span><span>公开产业采集 / 金融金额保留来源精度 / 生产发布待接入</span></footer>
</main>
<dialog class="modal" id="sources"><div class="modalhead"><h2>数据口径与来源</h2><button aria-label="关闭数据来源" id="source-close">×</button></div><div id="source-list"></div></dialog>
<dialog class="modal" id="export-dialog"><div class="modalhead"><h2 id="export-title">导出当前数据</h2><button aria-label="关闭导出" id="export-close">×</button></div><p class="note">可下载CSV，或直接复制下方完整内容。金额、单位、统计期和原始来源均保留。</p><a id="csv-link" class="quiet" style="display:inline-block;margin:16px 0" download>下载CSV</a><textarea id="csv-preview" aria-label="CSV完整内容" readonly style="width:100%;height:240px;background:#081411;color:#edf4e8;border:1px solid #284038;padding:12px"></textarea></dialog><div class="toast" id="toast" role="status" hidden></div>
<template id="map-template"><svg class="map" viewBox="0 0 720 460" aria-label="省级产业数据地图">__MAP_PATHS__</svg></template>
<script>
const DATA=__SNAPSHOT__;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allRows=[...DATA.observations,...DATA.manual_observations],sourceList=[...DATA.sources,...DATA.reference_sources];
const source=r=>sourceList.find(s=>s.source_id===r.source_id)||{},period=r=>r.period||r.period_end?.slice(0,4)||'待接入';
const url=r=>r.source_url||source(r).url,link=r=>url(r)?`<a href="${esc(url(r))}" target="_blank" rel="noopener">原始来源 ↗</a>`:'待接入';
const fmt=r=>`${({gt:'超',ge:'至少',approx:'约'}[r.qualifier]||'')}${String(r.value).replace(/\B(?=(\d{3})+(?!\d))/g,',')}`;
const national=m=>allRows.find(r=>r.metric===m&&r.region==='全国');
const PAGES={overview:['全国产业总览','从产地规模、市场行情、流通设施到金融环境，查看已核实的产业基础。'],crop:['种植养殖','31省粮食统计已采集；果园、茶园、棉花当前展示人工核对样本。'],market:['市场行情','蔬菜、水果、水产、肉蛋禽与奶类行情，保留市场、规格、原始报价和统计期。'],cold:['冷链流通','查看公开骨干冷链基地样本及其已披露能力，辅助识别流通节点。'],risk:['产业风险','年度受灾统计与农产品质量抽检，农业气象监测作为下一步接入。'],finance:['农业供应链金融','涉农金融背景与平台融资运营分别呈现，支持订单、应收账款和仓单业务。']};
const METRICS={grain_production:'粮食产量',grain_area:'粮食播种面积',grain_yield:'粮食单产',orchard_area:'果园面积 · 样本',cotton_area:'棉花面积 · 样本',tea_area:'茶园面积 · 样本'};
let page='overview',metric='grain_production',region='',mode='public',exportRows=[];
function card(r,subtitle){return `<div class="stat"><div class="label">${esc(r.metric_name)}</div><div class="value">${fmt(r)}<small>${esc(r.unit)}</small></div><div class="meta">${esc(subtitle||`${r.region} · ${period(r)}年`)} · ${link(r)}</div></div>`}
function cards(rows){return `<div class="stats">${rows.map(r=>card(r)).join('')}</div>`}
function panel(title,body,span='span6'){return `<section class="panel ${span}"><h2>${title}</h2>${body}</section>`}
function bars(rows,key='region',max){max=max||Math.max(...rows.map(r=>Number(r.value)),1);return rows.map(r=>`<div class="barrow"><span>${esc(r[key]||r.metric_name)}</span><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(r.value)/max*100))}%"></div></div><div class="number">${fmt(r)}${r.yoy_percent!==undefined&&r.yoy_percent!==null?`<small>同比 ${r.yoy_percent}%</small>`:''}</div></div>`).join('')||'<div class="empty">当前筛选没有已接入数据</div>'}
function table(rows){return `<div class="tablewrap"><table><thead><tr><th>地区 / 品类</th><th>指标</th><th>数值</th><th>单位</th><th>统计期</th><th>来源</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.region)}${r.category?' · '+esc(r.category):''}</td><td>${esc(r.metric_name)}</td><td>${fmt(r)}</td><td>${esc(r.unit)}</td><td>${period(r)}年</td><td>${link(r)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">当前地区暂无该指标数据，请切换指标或恢复全国视图。</td></tr>'}</tbody></table></div>`}
function mapPanel(title,note){return panel(title,`${$('map-template').innerHTML}<div class="legend"><span><i></i>由低到高 · 当前指标</span><span>灰色：未接入</span></div><div class="mapdetail" id="map-detail">${esc(note)}</div>`,'span7')}
function installMap(rows,onChoose){const lookup=new Map(rows.map(r=>[r.region,r])),max=Math.max(...rows.map(r=>Number(r.value)),1);document.querySelectorAll('#content .province').forEach(p=>{const r=lookup.get(p.dataset.province);p.style.fill=r?`hsl(91 30% ${18+Number(r.value)/max*45}%)`:'#1b2b25';p.classList.toggle('selected',region===p.dataset.province);p.setAttribute('aria-label',`${p.dataset.province}，${r?fmt(r)+' '+r.unit:'未接入'}，选择地区`);function detail(){$('map-detail').textContent=`${p.dataset.province} · ${r?fmt(r)+' '+r.unit+' · '+period(r)+'年':'暂无已接入数据'}`}p.onpointerenter=detail;p.onfocus=detail;p.onclick=()=>onChoose(p.dataset.province);p.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();onChoose(p.dataset.province)}}})}
function overview(){const rows=DATA.observations.filter(r=>r.metric==='grain_production'&&r.region!=='全国').sort((a,b)=>Number(b.value)-Number(a.value));exportRows=allRows;$('content').innerHTML=cards(['grain_production','grain_area','aquatic_production','agricultural_related_credit'].map(national))+`<div class="grid">${mapPanel('全国粮食产量 · 2025年','点击省份进入种植养殖；地图单位为万吨。')}${panel('粮食主产省份',bars(rows.slice(0,6))+'<p class="note">2025年 · 万吨 · 零基准横向比较</p>','span5')}${panel('数据接入进度',`<div class="listrow"><div><strong>109 条自动采集产业记录</strong><p>国家统计局 / 人民银行 / 农业农村部 / 财政部</p></div><span class="tag">4个固定发布页</span></div><div class="listrow"><div><strong>${DATA.market_record_count.toLocaleString()} 条农产品行情快照</strong><p>2026.09.12–09.30，各来源日期分别标注</p></div><span class="tag">已采集样本</span></div><div class="listrow"><div><strong>12 条人工核对指标 · 5 个冷链节点</strong><p>种植样本、受灾、抽检及基地资料</p></div><span class="tag">局部覆盖</span></div>`)}${panel('下一步补齐',`<div class="listrow"><div><strong>省级经济作物与畜牧结构</strong><p>果园、茶园、油料、蔬菜面积；存栏、出栏、肉蛋奶产量。</p></div></div><div class="listrow"><div><strong>平台供应链金融</strong><p>确权订单、应收账款、仓单货值、银行放款和回款回执。</p></div></div><p class="note">当前为历史资料快照，未建立自动定期更新或生产入库。</p>`)}</div>`;installMap(rows,p=>{region=p;metric='grain_production';page='crop';render()})}
function crop(){const rows=allRows.filter(r=>r.metric===metric&&r.region!=='全国').sort((a,b)=>Number(b.value)-Number(a.value)),filtered=rows.filter(r=>!region||r.region===region);exportRows=filtered;const n=national(metric);$('content').innerHTML=`<div class="stats">${n?card(n,'全国官方总量 · '+period(n)+'年'):card({metric_name:'当前已核实省级样本',value:String(rows.length),unit:'条',qualifier:'exact',period:'2024',region:'局部覆盖',source_id:'nbs_crop_samples'})}${['aquaculture_area','marine_aquaculture_area','freshwater_aquaculture_area'].map(m=>card(national(m),'全国水产统计 · 2025年 · 不随省份筛选')).join('')}</div><div class="grid">${mapPanel(METRICS[metric],`${region||'全国视图'} · ${rows[0]?.unit||''} · ${rows[0]?period(rows[0]):'待接入'}年`)}${panel('省级比较 · '+(region||'已采集省份'),bars(filtered.slice(0,8))+`<p class="note">${rows[0]?.unit||''} · 从零开始 · 展示${Math.min(filtered.length,8)}条<br>果园、茶园面积与年度播种面积口径不同，不合计。${metric==='grain_area'?'1千公顷 = 1.5万亩。':''}</p>`,'span5')}${panel('当前筛选数据 · '+filtered.length+'条',table(filtered),'span12')}</div>`;installMap(rows,p=>{region=region===p?'':p;render()})}
function cold(){const rows=DATA.cold_nodes.filter(r=>!region||r.region===region);exportRows=rows;const counts={};DATA.cold_nodes.forEach(r=>counts[r.region]=(counts[r.region]||0)+1);$('content').innerHTML=`<div class="stats"><div class="stat"><div class="label">国家骨干冷链物流基地</div><div class="value">105<small>个</small></div><div class="meta">2025.06.09公开名单时点 · 全国总数</div></div><div class="stat"><div class="label">已核对展示节点</div><div class="value">5<small>个</small></div><div class="meta">仅展示部分基地资料</div></div><div class="stat"><div class="label">当前筛选节点</div><div class="value">${rows.length}<small>个样本</small></div><div class="meta">${region||'全部已核实样本'}，不是地区基地总数</div></div><div class="stat pending"><div class="label">实时可用冷库容量 / 在途货物</div><div class="value">待接入</div><div class="meta">需仓储及物流系统回执</div></div></div><div class="grid">${mapPanel('已核对冷链基地分布','地图统计展示样本数，不代表全国基地密度。')}${panel('基地资料 · '+(region||'全部样本'),rows.map(r=>`<div class="listrow"><div><strong>${esc(r.name)}</strong><p>${esc(r.reported)}</p><p>${esc(r.city)} · ${esc(r.scope)} · ${link(r)}</p></div></div>`).join('')||'<div class="empty">该省份尚无已核对节点样本。</div>','span5')}${panel('流通数据接入',`<p class="note">下一步接入基地完整名单、冷库设施容量、仓储费用、运输时效与损耗。库容和年度周转量属于不同指标，当前公开资料不能计算实时库存、运输轨迹或货物损耗。</p>`,'span12')}</div>`;installMap(Object.entries(counts).map(([region,n])=>({region,value:String(n),unit:'个样本',qualifier:'exact',period:'2025'})),p=>{region=region===p?'':p;render()})}
function risk(){const rows=allRows.filter(r=>['disaster_area','crop_failure_area','quality_rate','category_quality_rate'].includes(r.metric));exportRows=rows;$('content').innerHTML=cards(rows.filter(r=>r.metric!=='category_quality_rate'))+`<div class="grid">${panel('分品类例行监测合格率 · 2025年',`<div class="quality">${bars(rows.filter(r=>r.metric==='category_quality_rate'),'category',100)}</div><p class="note">单位% · 零至100%比例尺 · 官方抽检样本，不代表全部产品或平台供应商。</p>`)}${panel('风险数据接入',`<div class="listrow"><div><strong>年度自然灾害</strong><p>绝收面积包含于受灾面积，不相加；全国年度统计不能定位当前灾害。</p></div><span class="tag">已核对</span></div><div class="listrow"><div><strong>农业气象与灾害预警</strong><p>中央气象台农业气象资料，动态数据尚未采集。</p><a href="${esc(source({source_id:'nmc_agro'}).url)}" target="_blank" rel="noopener">查看气象来源 ↗</a></div><span class="tag">待接入</span></div><div class="listrow"><div><strong>平台履约与资产风险</strong><p>交付延误、冷链温度异常、仓单重复质押与回款逾期。</p></div><span class="tag">待接入</span></div>`)}</div>`}
const BUSINESS=[['融资申请金额','期间申请金额；不等于银行批准或已放款金额'],['银行实际放款','按有效银行回执统计期间累计放款'],['融资本金余额','截至时点实际放款本金减已偿还本金'],['应收账款未收余额','已确认应收金额减已匹配收款'],['仓单质押货值','有效质押仓单数量 × 经确认的估值单价'],['逾期本金 / 逾期率','逾期本金除以同一时点融资本金余额；余额为0时不计算'],['融资企业数','统计期有实际融资业务的企业去重'],['加权融资利率','按放款本金加权，保留期限与费用口径']];
function finance(){if(mode==='platform'){exportRows=[];$('content').innerHTML=`<div class="stats pending">${BUSINESS.slice(0,4).map(([name,definition])=>`<div class="stat"><div class="label">${name}</div><div class="value">待接入</div><div class="meta">${definition}</div></div>`).join('')}</div><div class="grid">${panel('业务链路与融资资产',`<div class="workflow"><span>订单 / 应收 / 仓单</span><b>→</b><span>资产确权</span><b>→</b><span>银行审批</span><b>→</b><span>放款回执</span><b>→</b><span>还款核销</span></div><div class="listrow"><div><strong>订单融资</strong><p>订单签约、履约、付款方和回款状态</p></div><span class="tag">业务系统待接入</span></div><div class="listrow"><div><strong>应收账款融资</strong><p>确权、未收金额、到期日和收款核销</p></div><span class="tag">确权 / 结算待接入</span></div><div class="listrow"><div><strong>仓单质押融资</strong><p>仓单有效性、可用货值、库存验证与质押状态</p></div><span class="tag">仓储 / 银行待接入</span></div>`,'span7')}${panel('后续运营指标',BUSINESS.slice(4).map(([name,definition])=>`<div class="listrow"><div><strong>${name}</strong><p>${definition}</p></div><span class="tag">待接入</span></div>`).join(''),'span5')}</div>`;return}const loans=DATA.observations.filter(r=>r.measure_type==='balance'&&r.source_id==='pbc_credit'),insurance=DATA.observations.filter(r=>r.source_id==='mof_agri_insurance');exportRows=[...loans,...insurance];$('content').innerHTML=cards(loans)+`<div class="grid">${panel('涉农信贷余额 · 2025年末',bars(loans.map(r=>({...r,label:r.metric_name.replace('余额','')})),'label')+'<p class="note">单位：万亿元 · 同比增长单独列示 · 横轴从0开始</p>','span7')}${panel('统计范围与使用方式',`<div class="listrow"><div><strong>行业金融背景</strong><p>2025年12月31日全国贷款余额及同比，当前未采集更新季度或省级明细。</p></div><span class="tag">历史快照</span></div><div class="listrow"><div><strong>分类存在交叉</strong><p>涉农、农村、农户和农业贷款不可相加，也不作为平台融资规模。</p></div></div><div class="listrow"><div><strong>供应链金融运营</strong><p>切换到平台融资运营，可查看确权、实际放款、余额和回款指标定义。</p></div><span class="tag">待接入</span></div>`,'span5')}${panel('农业保险与风险保障 · 2025年',cards(insurance)+'<p class="note">财政部原文披露的“超”作为下限保留；保费、保障金额、赔款、中央补贴不相加。</p>','span12')}</div><div class="callout">公开涉农金融统计用于产业背景分析，农业供应链融资业务需要平台及银行的真实回执。当前还不能给出全国农业供应链融资总量。</div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));$('page-title').textContent=PAGES[page][0];$('page-desc').textContent=PAGES[page][1];$('filters').hidden=!['crop','cold'].includes(page);$('metric').hidden=page!=='crop';document.querySelector('label[for=metric]').hidden=page!=='crop';$('region').value=region;$('metric').value=metric;$('finance-seg').hidden=page!=='finance';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('export').disabled=page==='market';({overview,crop,cold,risk,finance,market:()=>{exportRows=[];$('content').innerHTML='<p class="note" style="margin-bottom:12px">行情使用下方独立筛选与“全部明细”导出。<a href="agri-market-dashboard.html" target="_blank" rel="noopener">单独打开行情大屏 ↗</a></p><iframe class="iframe" title="农产品市场行情大屏" src="agri-market-dashboard.html"></iframe>'}}[page])()}
$('nav').innerHTML=Object.entries(PAGES).map(([id,[name]])=>`<button data-page="${id}" aria-pressed="${id===page}">${name}</button>`).join('');$('nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;region='';render()}};
$('metric').innerHTML=Object.entries(METRICS).map(([id,name])=>`<option value="${id}">${name}</option>`).join('');$('region').innerHTML='<option value="">全国 / 全部样本</option>'+DATA.observations.filter(r=>r.metric==='grain_production'&&r.region!=='全国').map(r=>`<option>${esc(r.region)}</option>`).join('')+['台湾省','香港特别行政区','澳门特别行政区'].map(p=>`<option>${p}</option>`).join('');$('metric').onchange=e=>{metric=e.target.value;render()};$('region').onchange=e=>{region=e.target.value;render()};$('reset').onclick=()=>{region='';render()};$('finance-seg').onclick=e=>{const b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;render()}};
$('source-open').onclick=()=>{$('source-list').innerHTML=`<p class="note">109条程序采集、12条人工核对、5个冷链样本。统计期不同；来源固定在已核实发布页，当前不是最新资料的自动发现服务。金融分类重叠不合计，缺失数据不是0。</p>`+sourceList.map(s=>`<div class="source"><h3>${esc(s.name)}</h3><p>${esc(s.scope||`${s.year}年${s.quarter?'第'+s.quarter+'季度':''} · ${s.record_count}条记录 · 采集于${s.collected_at}`)}<br>状态：${esc(({collected:'程序采集',manual_reviewed:'人工核对',reference_only:'参考资料',pending:'待接入'}[s.status]||s.status))}</p>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">查看官方资料 ↗</a>`:''}</div>`).join('');$('sources').showModal()};$('source-close').onclick=()=>$('sources').close();
function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>{$('toast').hidden=true},2500)}
$('export').onclick=()=>{if(!exportRows.length){toast('当前没有可导出的已接入数据');return}const cols=['region','category','metric_name','value','qualifier','unit','period_start','period_end','period','yoy_percent','name','city','reported','scope','source_url','evidence'];const cell=v=>'"'+String(v??'').replaceAll('"','""')+'"';const text=[cols,...exportRows.map(r=>cols.map(c=>c==='source_url'?url(r):r[c]))].map(r=>r.map(cell).join(',')).join('\r\n');$('csv-preview').value=text;$('export-title').textContent=`导出当前筛选 · ${exportRows.length}条`;$('csv-link').href='data:text/csv;charset=utf-8,'+encodeURIComponent('\uFEFF'+text);$('csv-link').download=`赋能产业-${page}-${region||'全国样本'}.csv`;$('export-dialog').showModal()};
$('export-close').onclick=()=>$('export-dialog').close();
render();
</script></body></html>
