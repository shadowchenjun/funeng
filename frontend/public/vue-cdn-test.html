<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue组件调试页面</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .product { border: 1px solid #ddd; margin: 10px 0; padding: 15px; border-radius: 5px; }
        .success { color: #52c41a; }
        button { padding: 10px 20px; margin: 10px; background: #52c41a; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="app">
        <h1>🎉 Vue 3 CDN 测试页面</h1>
        <p>当前时间: {{ currentTime }}</p>
        <p>计数器: {{ counter }}</p>
        <button @click="counter++">点击 +1</button>
        
        <div style="margin: 20px 0;">
            <h3>产品数据测试：</h3>
            <div v-if="products.length > 0">
                <div v-for="product in products" :key="product.id" class="product">
                    <h4>{{ product.name }}</h4>
                    <p>价格: ¥{{ product.price }}</p>
                    <p>{{ product.description }}</p>
                </div>
            </div>
            <div v-else>
                <p>正在加载产品数据...</p>
                <p>加载状态: {{ loadingStatus }}</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        
        createApp({
            setup() {
                const products = ref([]);
                const counter = ref(0);
                const currentTime = ref(new Date().toLocaleString());
                const loadingStatus = ref('准备中...');
                
                onMounted(async () => {
                    console.log('Vue组件已挂载');
                    loadingStatus.value = '正在加载...';
                    
                    try {
                        const response = await fetch('http://localhost:8000/api/products');
                        const data = await response.json();
                        products.value = data.products || [];
                        loadingStatus.value = '加载完成';
                        console.log('产品数据加载成功:', data);
                    } catch (error) {
                        loadingStatus.value = '加载失败: ' + error.message;
                        console.error('数据加载失败:', error);
                    }
                    
                    setInterval(() => {
                        currentTime.value = new Date().toLocaleString();
                    }, 1000);
                });
                
                return {
                    products,
                    counter,
                    currentTime,
                    loadingStatus
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
