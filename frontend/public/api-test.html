<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API连接测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #f0f9ff; border-color: #1890ff; }
        .error { background-color: #fff2f0; border-color: #ff4d4f; }
        .warning { background-color: #fffbe6; border-color: #faad14; }
        pre { background-color: #f5f5f5; padding: 10px; border-radius: 3px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
        .button { padding: 8px 16px; margin: 5px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .button:hover { background: #40a9ff; }
    </style>
</head>
<body>
    <h1>🔧 API连接诊断工具</h1>
    
    <div id="results"></div>

    <div class="test-section">
        <h3>快速操作</h3>
        <button class="button" onclick="runAllTests()">运行所有测试</button>
        <button class="button" onclick="clearResults()">清除结果</button>
        <button class="button" onclick="restartServices()">重启后端服务</button>
    </div>

    <script>
        const results = document.getElementById('results');
        
        // 添加测试结果
        function addResult(title, status, message, data = null) {
            const section = document.createElement('div');
            section.className = `test-section ${status}`;
            
            let content = `
                <h3>${status === 'success' ? '✅' : status === 'error' ? '❌' : '⚠️'} ${title}</h3>
                <p><strong>状态:</strong> ${message}</p>
            `;
            
            if (data) {
                content += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            
            section.innerHTML = content;
            results.appendChild(section);
            
            // 自动滚动到最新结果
            section.scrollIntoView({ behavior: 'smooth' });
        }
        
        // 测试API连接
        async function testAPI(url, name) {
            try {
                const startTime = Date.now();
                const response = await fetch(url);
                const endTime = Date.now();
                const responseTime = endTime - startTime;
                
                if (response.ok) {
                    const data = await response.json();
                    addResult(
                        name, 
                        'success', 
                        `连接成功 (${responseTime}ms)`, 
                        data
                    );
                    return { success: true, data };
                } else {
                    addResult(
                        name, 
                        'error', 
                        `HTTP ${response.status}: ${response.statusText}`
                    );
                    return { success: false, error: `HTTP ${response.status}` };
                }
            } catch (error) {
                addResult(
                    name, 
                    'error', 
                    `连接失败: ${error.message}`
                );
                return { success: false, error: error.message };
            }
        }
        
        // 测试所有API
        async function runAllTests() {
            clearResults();
            
            console.log('开始API连接测试...');
            
            // 测试后端服务
            await testAPI('http://localhost:8000/health', '主后端服务 (8000)');
            await testAPI('http://localhost:8001/health', '管理后台服务 (8001)');
            
            // 测试前端服务
            try {
                const response = await fetch('http://localhost:3000/');
                if (response.ok) {
                    addResult('前端服务 (3000)', 'success', '连接正常');
                } else {
                    addResult('前端服务 (3000)', 'error', `HTTP ${response.status}`);
                }
            } catch (error) {
                addResult('前端服务 (3000)', 'error', `连接失败: ${error.message}`);
            }
            
            // 测试API端点
            await testAPI('http://localhost:8000/api/products', '产品列表API');
            await testAPI('http://localhost:8000/api/categories', '分类列表API');
            await testAPI('http://localhost:8001/admin/suppliers', '供应商管理API');
            await testAPI('http://localhost:8001/admin/users', '用户管理API');
            
            console.log('API测试完成');
        }
        
        // 清除结果
        function clearResults() {
            results.innerHTML = '';
        }
        
        // 模拟重启服务（仅显示提示）
        function restartServices() {
            addResult(
                '服务重启', 
                'warning', 
                '请手动重启后端服务：<br>' +
                '1. cd /Users/chenjun/funeng/backend<br>' +
                '2. python3 main_sqlite_fixed.py<br>' +
                '3. python3 admin_backend.py<br><br>' +
                '然后重新运行测试'
            );
        }
        
        // 页面加载时自动运行测试
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 1000);
        });
    </script>
</body>
</html>
