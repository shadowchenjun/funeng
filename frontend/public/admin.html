<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农业赋能平台管理后台</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; }
        .admin-header { background: #fff; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .admin-content { padding: 20px; }
        .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stats-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .stats-number { font-size: 28px; font-weight: bold; color: #409eff; margin-bottom: 8px; }
        .stats-label { color: #666; font-size: 14px; }
        .management-section { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .section-header { padding: 16px 20px; border-bottom: 1px solid #eee; font-weight: bold; font-size: 16px; }
        .section-content { padding: 20px; }
        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .el-button { margin: 5px !important; }
        .data-table { margin-top: 15px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="admin-header">
            <h1>🌾 农业赋能平台管理后台</h1>
            <div>
                <el-button type="primary" @click="refreshData">刷新数据</el-button>
            </div>
        </div>

        <div class="admin-content">
            <!-- 统计卡片 -->
            <div class="stats-cards">
                <div class="stats-card">
                    <div class="stats-number">{{ stats.products }}</div>
                    <div class="stats-label">商品总数</div>
                </div>
                <div class="stats-card">
                    <div class="stats-number">{{ stats.suppliers }}</div>
                    <div class="stats-label">供应商数量</div>
                </div>
                <div class="stats-card">
                    <div class="stats-number">{{ stats.users }}</div>
                    <div class="stats-label">用户数量</div>
                </div>
                <div class="stats-card">
                    <div class="stats-number">{{ stats.categories }}</div>
                    <div class="stats-label">商品分类</div>
                </div>
            </div>

            <!-- 供应商管理 -->
            <div class="management-section">
                <div class="section-header">
                    🏢 供应商管理
                </div>
                <div class="section-content">
                    <div class="action-buttons">
                        <el-button type="primary" @click="loadSuppliers">刷新供应商</el-button>
                        <el-button type="success" @click="showAddSupplier">添加供应商</el-button>
                        <el-button type="warning" @click="viewSupplierQualifications">管理资质</el-button>
                    </div>
                    <div class="data-table">
                        <el-table :data="suppliers" style="width: 100%" v-loading="loading.suppliers">
                            <el-table-column prop="name" label="供应商名称" />
                            <el-table-column prop="contact_person" label="联系人" />
                            <el-table-column prop="phone" label="电话" />
                            <el-table-column prop="qualification_count" label="资质数量" width="100" />
                            <el-table-column prop="status" label="状态" width="100">
                                <template #default="scope">
                                    <el-tag :type="scope.row.status === 'active' ? 'success' : 'danger'">
                                        {{ scope.row.status === 'active' ? '正常' : '停用' }}
                                    </el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column label="操作" width="200">
                                <template #default="scope">
                                    <el-button size="small" @click="editSupplier(scope.row)">编辑</el-button>
                                    <el-button size="small" type="danger" @click="deleteSupplier(scope.row.id)">删除</el-button>
                                </template>
                            </el-table-column>
                        </el-table>
                    </div>
                </div>
            </div>

            <!-- 商品管理 -->
            <div class="management-section">
                <div class="section-header">
                    🛍️ 商品管理
                </div>
                <div class="section-content">
                    <div class="action-buttons">
                        <el-button type="primary" @click="loadProducts">刷新商品</el-button>
                        <el-button type="success" @click="showAddProduct">添加商品</el-button>
                        <el-button type="warning" @click="manageProductImages">管理图片</el-button>
                    </div>
                    <div class="data-table">
                        <el-table :data="products" style="width: 100%" v-loading="loading.products">
                            <el-table-column prop="name" label="商品名称" />
                            <el-table-column prop="price" label="价格" width="100" />
                            <el-table-column prop="stock_quantity" label="库存" width="100" />
                            <el-table-column label="分类" width="120">
                                <template #default="scope">
                                    {{ scope.row.category ? scope.row.category.name : '未分类' }}
                                </template>
                            </el-table-column>
                            <el-table-column prop="status" label="状态" width="100">
                                <template #default="scope">
                                    <el-tag :type="scope.row.status === 'published' ? 'success' : 'warning'">
                                        {{ scope.row.status === 'published' ? '已发布' : '草稿' }}
                                    </el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column label="操作" width="200">
                                <template #default="scope">
                                    <el-button size="small" @click="editProduct(scope.row)">编辑</el-button>
                                    <el-button size="small" type="primary" @click="uploadProductImage(scope.row.id)">上传图片</el-button>
                                </template>
                            </el-table-column>
                        </el-table>
                    </div>
                </div>
            </div>

            <!-- 用户管理 -->
            <div class="management-section">
                <div class="section-header">
                    👥 用户管理
                </div>
                <div class="section-content">
                    <div class="action-buttons">
                        <el-button type="primary" @click="loadUsers">刷新用户</el-button>
                        <el-button type="success" @click="showAddUser">添加用户</el-button>
                    </div>
                    <div class="data-table">
                        <el-table :data="users" style="width: 100%" v-loading="loading.users">
                            <el-table-column prop="username" label="用户名" />
                            <el-table-column prop="nickname" label="昵称" />
                            <el-table-column prop="role_type" label="角色" width="100" />
                            <el-table-column prop="supplier_name" label="关联供应商" />
                            <el-table-column prop="status" label="状态" width="100">
                                <template #default="scope">
                                    <el-tag :type="scope.row.status === 'active' ? 'success' : 'danger'">
                                        {{ scope.row.status === 'active' ? '正常' : '停用' }}
                                    </el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column label="操作" width="150">
                                <template #default="scope">
                                    <el-button size="small" @click="editUser(scope.row)">编辑</el-button>
                                </template>
                            </el-table-column>
                        </el-table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue/dist/index.iife.js"></script>
    
    <script>
        const { createApp, ref, onMounted } = Vue;
        
        createApp({
            setup() {
                const stats = ref({ products: 0, suppliers: 0, users: 0, categories: 0 });
                const suppliers = ref([]);
                const products = ref([]);
                const users = ref([]);
                const loading = ref({ suppliers: false, products: false, users: false });

                // 加载统计数据
                const loadStats = async () => {
                    try {
                        const [suppliersRes, productsRes, usersRes, categoriesRes] = await Promise.all([
                            fetch('http://localhost:8001/admin/suppliers'),
                            fetch('http://localhost:8000/api/products'),
                            fetch('http://localhost:8001/admin/users'),
                            fetch('http://localhost:8000/api/categories')
                        ]);
                        
                        const suppliersData = await suppliersRes.json();
                        const productsData = await productsRes.json();
                        const usersData = await usersRes.json();
                        const categoriesData = await categoriesRes.json();
                        
                        stats.value = {
                            products: productsData.total || 0,
                            suppliers: suppliersData.total || 0,
                            users: usersData.total || 0,
                            categories: categoriesData.length || 0
                        };
                    } catch (error) {
                        console.error('加载统计数据失败:', error);
                    }
                };

                // 加载供应商
                const loadSuppliers = async () => {
                    loading.value.suppliers = true;
                    try {
                        const response = await fetch('http://localhost:8001/admin/suppliers');
                        const data = await response.json();
                        suppliers.value = data.suppliers || [];
                    } catch (error) {
                        ElementPlus.ElMessage.error('加载供应商失败: ' + error.message);
                    } finally {
                        loading.value.suppliers = false;
                    }
                };

                // 加载商品
                const loadProducts = async () => {
                    loading.value.products = true;
                    try {
                        const response = await fetch('http://localhost:8000/api/products');
                        const data = await response.json();
                        products.value = data.products || [];
                    } catch (error) {
                        ElementPlus.ElMessage.error('加载商品失败: ' + error.message);
                    } finally {
                        loading.value.products = false;
                    }
                };

                // 加载用户
                const loadUsers = async () => {
                    loading.value.users = true;
                    try {
                        const response = await fetch('http://localhost:8001/admin/users');
                        const data = await response.json();
                        users.value = data.users || [];
                    } catch (error) {
                        ElementPlus.ElMessage.error('加载用户失败: ' + error.message);
                    } finally {
                        loading.value.users = false;
                    }
                };

                // 刷新所有数据
                const refreshData = () => {
                    loadStats();
                    loadSuppliers();
                    loadProducts();
                    loadUsers();
                };

                // 模拟操作函数
                const showAddSupplier = () => ElementPlus.ElMessage.info('添加供应商功能开发中...');
                const viewSupplierQualifications = () => ElementPlus.ElMessage.info('资质管理功能开发中...');
                const editSupplier = (supplier) => ElementPlus.ElMessage.info(`编辑供应商: ${supplier.name}`);
                const deleteSupplier = (id) => ElementPlus.ElMessage.warning(`删除供应商 ID: ${id}`);
                
                const showAddProduct = () => ElementPlus.ElMessage.info('添加商品功能开发中...');
                const manageProductImages = () => ElementPlus.ElMessage.info('图片管理功能开发中...');
                const editProduct = (product) => ElementPlus.ElMessage.info(`编辑商品: ${product.name}`);
                const uploadProductImage = (productId) => ElementPlus.ElMessage.info(`上传商品图片 ID: ${productId}`);
                
                const showAddUser = () => ElementPlus.ElMessage.info('添加用户功能开发中...');
                const editUser = (user) => ElementPlus.ElMessage.info(`编辑用户: ${user.username}`);

                onMounted(() => {
                    refreshData();
                });

                return {
                    stats,
                    suppliers,
                    products,
                    users,
                    loading,
                    loadStats,
                    loadSuppliers,
                    loadProducts,
                    loadUsers,
                    refreshData,
                    showAddSupplier,
                    viewSupplierQualifications,
                    editSupplier,
                    deleteSupplier,
                    showAddProduct,
                    manageProductImages,
                    editProduct,
                    uploadProductImage,
                    showAddUser,
                    editUser
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
