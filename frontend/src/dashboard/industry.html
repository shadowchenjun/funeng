<script>
const DATA=__SNAPSHOT__, META=__META__, MARKET_DOCUMENT=__MARKET_DOCUMENT__;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const allRows=[...DATA.observations,...DATA.manual_observations],sourceList=[...DATA.sources,...DATA.reference_sources];
const source=r=>sourceList.find(s=>s.source_id===r.source_id)||{},period=r=>r.frequency==='annual'?`${r.period_end?.slice(0,4)||r.period||'待接入'}年`:r.period_start&&r.period_end?(r.period_start===r.period_end?r.period_end:`${r.period_start}–${r.period_end}`):r.period||r.snapshot_date||'待接入';
const safeUrl=u=>{try{const p=new URL(u);return ['http:','https:'].includes(p.protocol)?p.href:''}catch{return ''}};
const url=r=>safeUrl(r.source_url||source(r).url),link=r=>url(r)?`<a href="${esc(url(r))}" target="_blank" rel="noopener">原始来源 ↗</a>`:'待接入';
const fmt=r=>`${({gt:'超',ge:'至少',approx:'约'}[r.qualifier]||'')}${esc(String(r.value).split('.').map((part,i)=>i?part:part.replace(/\B(?=(\d{3})+(?!\d))/g,',')).join('.'))}`;
const national=m=>allRows.find(r=>r.metric===m&&r.region==='全国');
const PAGES={overview:['全国产业总览','从产地规模、市场行情、流通设施到金融环境，查看已核实的产业基础。'],crop:['种植养殖',`${new Set(DATA.observations.filter(r=>r.metric==='grain_production'&&r.region!=='全国').map(r=>r.region)).size}个省级地区粮食统计已入库；果园、茶园、棉花展示已核对样本。`],market:['市场行情','蔬菜、水果、水产、肉蛋禽与奶类行情，保留市场、规格、原始报价和统计期。'],cold:['冷链流通','查看公开骨干冷链基地样本及其已披露能力，辅助识别流通节点。'],risk:['产业风险','年度受灾统计与农产品质量抽检，农业气象监测作为下一步接入。'],finance:['农业供应链金融','涉农金融背景与平台融资运营分别呈现，支持订单、应收账款和仓单业务。']};
const METRICS={grain_production:'粮食产量',grain_area:'粮食播种面积',grain_yield:'粮食单产',orchard_area:'果园面积 · 样本',cotton_area:'棉花面积 · 样本',tea_area:'茶园面积 · 样本'};
let page='overview',metric='grain_production',region='',mode='public',exportRows=[];
function card(r,subtitle){if(!r)return '<div class="stat pending"><div class="label">暂无已入库指标</div><div class="value">待接入</div></div>';return `<div class="stat"><div class="label">${esc(r.metric_name)}</div><div class="value">${fmt(r)}<small>${esc(r.unit)}</small></div><div class="meta">${esc(subtitle||`${r.region} · ${period(r)}`)} · ${link(r)}</div></div>`}
function cards(rows){return `<div class="stats">${rows.map(r=>card(r)).join('')}</div>`}
function panel(title,body,span='span6'){return `<section class="panel ${span}"><h2>${esc(title)}</h2>${body}</section>`}
function bars(rows,key='region',max){max=max||Math.max(...rows.map(r=>Number(r.value)),1);return rows.map(r=>`<div class="barrow"><span>${esc(r[key]||r.metric_name)}</span><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(r.value)/max*100))}%"></div></div><div class="number">${fmt(r)}${r.yoy_percent!==undefined&&r.yoy_percent!==null?`<small>同比 ${esc(r.yoy_percent)}%</small>`:''}</div></div>`).join('')||'<div class="empty">当前筛选没有已接入数据</div>'}
function table(rows){return `<div class="tablewrap"><table><thead><tr><th>地区 / 品类</th><th>指标</th><th>数值</th><th>单位</th><th>统计期</th><th>来源</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.region)}${r.category?' · '+esc(r.category):''}</td><td>${esc(r.metric_name)}</td><td>${fmt(r)}</td><td>${esc(r.unit)}</td><td>${period(r)}</td><td>${link(r)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">当前地区暂无该指标数据，请切换指标或恢复全国视图。</td></tr>'}</tbody></table></div>`}
function mapPanel(title,note){return panel(title,`${$('map-template').innerHTML}<div class="legend"><span><i></i>由低到高 · 当前指标</span><span>灰色：未接入</span></div><div class="mapdetail" id="map-detail">${esc(note)}</div>`,'span7')}
function installMap(rows,onChoose){const lookup=new Map(rows.map(r=>[r.region,r])),max=Math.max(...rows.map(r=>Number(r.value)),1);document.querySelectorAll('#content .province').forEach(p=>{const r=lookup.get(p.dataset.province);p.style.fill=r?`hsl(91 30% ${18+Number(r.value)/max*45}%)`:'#1b2b25';p.classList.toggle('selected',region===p.dataset.province);p.setAttribute('aria-label',`${p.dataset.province}，${r?fmt(r)+' '+r.unit:'未接入'}，选择地区`);function detail(){$('map-detail').textContent=`${p.dataset.province} · ${r?fmt(r)+' '+r.unit+' · '+period(r):'暂无已接入数据'}`}p.onpointerenter=detail;p.onfocus=detail;p.onclick=()=>onChoose(p.dataset.province);p.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();onChoose(p.dataset.province)}}})}
function overview(){const rows=DATA.observations.filter(r=>r.metric==='grain_production'&&r.region!=='全国').sort((a,b)=>Number(b.value)-Number(a.value));exportRows=allRows;$('content').innerHTML=cards(['grain_production','grain_area','aquatic_production','agricultural_related_credit'].map(national))+`<div class="grid">${mapPanel('全国粮食产量 · '+period(national('grain_production')||{}) ,'点击省份进入种植养殖；地图单位为万吨。')}${panel('粮食主产省份',bars(rows.slice(0,6))+'<p class="note">'+period(national('grain_production')||{})+' · 万吨 · 零基准横向比较</p>','span5')}${panel('数据接入进度',`<div class="listrow"><div><strong>${DATA.observations.length} 条程序采集产业记录</strong><p>国家统计局 / 人民银行 / 农业农村部 / 财政部</p></div><span class="tag">${DATA.sources.filter(s=>s.status==='collected').length}个已采集来源</span></div><div class="listrow"><div><strong>${DATA.market_record_count.toLocaleString()} 条农产品行情快照</strong><p>${esc(META.price_from||"暂无日期")}–${esc(META.price_to||"暂无日期")}，各来源日期分别标注</p></div><span class="tag">已采集样本</span></div><div class="listrow"><div><strong>${DATA.manual_observations.length} 条人工核对指标 · ${DATA.cold_nodes.length} 个冷链节点</strong><p>种植样本、受灾、抽检及基地资料</p></div><span class="tag">局部覆盖</span></div>`)}${panel('下一步补齐',`<div class="listrow"><div><strong>省级经济作物与畜牧结构</strong><p>果园、茶园、油料、蔬菜面积；存栏、出栏、肉蛋奶产量。</p></div></div><div class="listrow"><div><strong>平台供应链金融</strong><p>确权订单、应收账款、仓单货值、银行放款和回款回执。</p></div></div><p class="note">已入库公开资料按各自统计期展示；${META.automatic_collection?"行情每日定时检查，年报和季报仍按报告更新":"当前尚未配置自动采集"}。</p>`)}</div>`;installMap(rows,p=>{region=p;metric='grain_production';page='crop';render()})}
function crop(){const rows=allRows.filter(r=>r.metric===metric&&r.region!=='全国').sort((a,b)=>Number(b.value)-Number(a.value)),filtered=rows.filter(r=>!region||r.region===region);exportRows=filtered;const n=national(metric);$('content').innerHTML=`<div class="stats">${n?card(n,'全国官方总量 · '+period(n) ):card({metric_name:'当前已核实省级样本',value:String(rows.length),unit:'条',qualifier:'exact',period:rows[0]?period(rows[0]):'待接入',region:'局部覆盖',source_id:rows[0]?.source_id})}${['aquaculture_area','marine_aquaculture_area','freshwater_aquaculture_area'].map(m=>card(national(m),'全国水产统计 · '+period(national(m)||{})+' · 不随省份筛选')).join('')}</div><div class="grid">${mapPanel(METRICS[metric],`${region||'全国视图'} · ${rows[0]?.unit||''} · ${rows[0]?period(rows[0]):'待接入'}`)}${panel('省级比较 · '+(region||'已采集省份'),bars(filtered.slice(0,8))+`<p class="note">${rows[0]?.unit||''} · 从零开始 · 展示${Math.min(filtered.length,8)}条<br>果园、茶园面积与年度播种面积口径不同，不合计。${metric==='grain_area'?'1千公顷 = 1.5万亩。':''}</p>`,'span5')}${panel('当前筛选数据 · '+filtered.length+'条',table(filtered),'span12')}</div>`;installMap(rows,p=>{region=region===p?'':p;render()})}
function cold(){const rows=DATA.cold_nodes.filter(r=>!region||r.region===region);exportRows=rows;const counts={};DATA.cold_nodes.forEach(r=>counts[r.region]=(counts[r.region]||0)+1);$('content').innerHTML=`<div class="stats"><div class="stat"><div class="label">国家骨干冷链物流基地</div><div class="value">待接入<small>个</small></div><div class="meta">当前数据库未收录全国基地总数</div></div><div class="stat"><div class="label">已核对展示节点</div><div class="value">${DATA.cold_nodes.length}<small>个</small></div><div class="meta">仅展示部分基地资料</div></div><div class="stat"><div class="label">当前筛选节点</div><div class="value">${rows.length}<small>个样本</small></div><div class="meta">${region||'全部已核实样本'}，不是地区基地总数</div></div><div class="stat pending"><div class="label">实时可用冷库容量 / 在途货物</div><div class="value">待接入</div><div class="meta">需仓储及物流系统回执</div></div></div><div class="grid">${mapPanel('已核对冷链基地分布','地图统计展示样本数，不代表全国基地密度。')}${panel('基地资料 · '+(region||'全部样本'),rows.map(r=>`<div class="listrow"><div><strong>${esc(r.name)}</strong><p>${esc(r.reported)}</p><p>${esc(r.city)} · ${esc(r.scope)} · ${link(r)}</p></div></div>`).join('')||'<div class="empty">该省份尚无已核对节点样本。</div>','span5')}${panel('流通数据接入',`<p class="note">下一步接入基地完整名单、冷库设施容量、仓储费用、运输时效与损耗。库容和年度周转量属于不同指标，当前公开资料不能计算实时库存、运输轨迹或货物损耗。</p>`,'span12')}</div>`;installMap(Object.entries(counts).map(([region,n])=>({region,value:String(n),unit:'个样本',qualifier:'exact',period:'当前入库样本'})),p=>{region=region===p?'':p;render()})}
function risk(){const rows=allRows.filter(r=>['disaster_area','crop_failure_area','quality_rate','category_quality_rate'].includes(r.metric));exportRows=rows;$('content').innerHTML=cards(rows.filter(r=>r.metric!=='category_quality_rate'))+`<div class="grid">${panel('分品类例行监测合格率 · '+period(rows.find(r=>r.metric==='category_quality_rate')||{}) ,`<div class="quality">${bars(rows.filter(r=>r.metric==='category_quality_rate'),'category',100)}</div><p class="note">单位% · 零至100%比例尺 · 官方抽检样本，不代表全部产品或平台供应商。</p>`)}${panel('风险数据接入',`<div class="listrow"><div><strong>年度自然灾害</strong><p>绝收面积包含于受灾面积，不相加；全国年度统计不能定位当前灾害。</p></div><span class="tag">已核对</span></div><div class="listrow"><div><strong>农业气象与灾害预警</strong><p>中央气象台农业气象资料，动态数据尚未采集。</p><a href="${esc(safeUrl(source({source_id:'nmc_agro'}).url))}" target="_blank" rel="noopener">查看气象来源 ↗</a></div><span class="tag">待接入</span></div><div class="listrow"><div><strong>平台履约与资产风险</strong><p>交付延误、冷链温度异常、仓单重复质押与回款逾期。</p></div><span class="tag">待接入</span></div>`)}</div>`}
const BUSINESS=[['融资申请金额','期间申请金额；不等于银行批准或已放款金额'],['银行实际放款','按有效银行回执统计期间累计放款'],['融资本金余额','截至时点实际放款本金减已偿还本金'],['应收账款未收余额','已确认应收金额减已匹配收款'],['仓单质押货值','有效质押仓单数量 × 经确认的估值单价'],['逾期本金 / 逾期率','逾期本金除以同一时点融资本金余额；余额为0时不计算'],['融资企业数','统计期有实际融资业务的企业去重'],['加权融资利率','按放款本金加权，保留期限与费用口径']];
function finance(){if(mode==='platform'){exportRows=[];$('content').innerHTML=`<div class="stats pending">${BUSINESS.slice(0,4).map(([name,definition])=>`<div class="stat"><div class="label">${name}</div><div class="value">待接入</div><div class="meta">${definition}</div></div>`).join('')}</div><div class="grid">${panel('业务链路与融资资产',`<div class="workflow"><span>订单 / 应收 / 仓单</span><b>→</b><span>资产确权</span><b>→</b><span>银行审批</span><b>→</b><span>放款回执</span><b>→</b><span>还款核销</span></div><div class="listrow"><div><strong>订单融资</strong><p>订单签约、履约、付款方和回款状态</p></div><span class="tag">业务系统待接入</span></div><div class="listrow"><div><strong>应收账款融资</strong><p>确权、未收金额、到期日和收款核销</p></div><span class="tag">确权 / 结算待接入</span></div><div class="listrow"><div><strong>仓单质押融资</strong><p>仓单有效性、可用货值、库存验证与质押状态</p></div><span class="tag">仓储 / 银行待接入</span></div>`,'span7')}${panel('后续运营指标',BUSINESS.slice(4).map(([name,definition])=>`<div class="listrow"><div><strong>${name}</strong><p>${definition}</p></div><span class="tag">待接入</span></div>`).join(''),'span5')}</div>`;return}const loans=DATA.observations.filter(r=>r.measure_type==='balance'&&r.source_id==='pbc_credit'),insurance=DATA.observations.filter(r=>r.source_id==='mof_agri_insurance');exportRows=[...loans,...insurance];$('content').innerHTML=cards(loans)+`<div class="grid">${panel('涉农信贷余额 · '+period(loans[0]||{}) ,bars(loans.map(r=>({...r,label:r.metric_name.replace('余额','')})),'label')+'<p class="note">单位：万亿元 · 同比增长单独列示 · 横轴从0开始</p>','span7')}${panel('统计范围与使用方式',`<div class="listrow"><div><strong>行业金融背景</strong><p>${esc(loans[0]?.period_end||"暂无日期")}全国贷款余额及同比；省级明细尚未接入。</p></div><span class="tag">历史快照</span></div><div class="listrow"><div><strong>分类存在交叉</strong><p>涉农、农村、农户和农业贷款不可相加，也不作为平台融资规模。</p></div></div><div class="listrow"><div><strong>供应链金融运营</strong><p>切换到平台融资运营，可查看确权、实际放款、余额和回款指标定义。</p></div><span class="tag">待接入</span></div>`,'span5')}${panel('农业保险与风险保障 · '+period(insurance[0]||{}) ,cards(insurance)+'<p class="note">财政部原文披露的“超”作为下限保留；保费、保障金额、赔款、中央补贴不相加。</p>','span12')}</div><div class="callout">公开涉农金融统计用于产业背景分析，农业供应链融资业务需要平台及银行的真实回执。当前还不能给出全国农业供应链融资总量。</div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));$('page-title').textContent=PAGES[page][0];$('page-desc').textContent=PAGES[page][1];$('filters').hidden=!['crop','cold'].includes(page);$('metric').hidden=page!=='crop';document.querySelector('label[for=metric]').hidden=page!=='crop';$('region').value=region;$('metric').value=metric;$('finance-seg').hidden=page!=='finance';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('export').disabled=page==='market';({overview,crop,cold,risk,finance,market:()=>{exportRows=[];$('content').innerHTML='<p class="note" style="margin-bottom:12px">行情使用下方独立筛选与“全部明细”导出。</p><iframe class="iframe" title="农产品市场行情大屏" id="market-frame" allow="fullscreen"></iframe>'}}[page])();if(page==='market')$('market-frame').srcdoc=MARKET_DOCUMENT;}
$('nav').innerHTML=Object.entries(PAGES).map(([id,[name]])=>`<button data-page="${id}" aria-pressed="${id===page}">${name}</button>`).join('');$('nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;region='';render()}};
$('metric').innerHTML=Object.entries(METRICS).map(([id,name])=>`<option value="${id}">${name}</option>`).join('');$('region').innerHTML='<option value="">全国 / 全部样本</option>'+DATA.observations.filter(r=>r.metric==='grain_production'&&r.region!=='全国').map(r=>`<option>${esc(r.region)}</option>`).join('')+['台湾省','香港特别行政区','澳门特别行政区'].map(p=>`<option>${p}</option>`).join('');$('metric').onchange=e=>{metric=e.target.value;render()};$('region').onchange=e=>{region=e.target.value;render()};$('reset').onclick=()=>{region='';render()};$('finance-seg').onclick=e=>{const b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;render()}};
$('source-open').onclick=()=>{$('source-list').innerHTML=`<p class="note">${DATA.observations.length}条程序采集、${DATA.manual_observations.length}条人工核对、${DATA.cold_nodes.length}个冷链样本。统计期不同；来源固定在已核实发布页，当前不是最新资料的自动发现服务。金融分类重叠不合计，缺失数据不是0。</p>`+sourceList.map(s=>`<div class="source"><h3>${esc(s.name)}</h3><p>${esc(s.scope||`${s.year}年${s.quarter?'第'+s.quarter+'季度':''} · ${s.record_count}条记录 · 采集于${s.collected_at}`)}<br>状态：${esc(({collected:'程序采集',manual_reviewed:'人工核对',reference_only:'参考资料',pending:'待接入'}[s.status]||s.status))}</p>${s.url?`<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">查看官方资料 ↗</a>`:''}</div>`).join('');$('sources').showModal()};$('source-close').onclick=()=>$('sources').close();
function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>{$('toast').hidden=true},2500)}
$('export').onclick=()=>{if(!exportRows.length){toast('当前没有可导出的已接入数据');return}const cols=['region','category','metric_name','value','qualifier','unit','period_start','period_end','period','yoy_percent','name','city','reported','scope','source_url','evidence'];const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,m=>"'"+m).replaceAll('"','""')+'"';const text=[cols,...exportRows.map(r=>cols.map(c=>c==='source_url'?url(r):r[c]))].map(r=>r.map(cell).join(',')).join('\r\n');$('csv-preview').value=text;$('export-title').textContent=`导出当前筛选 · ${exportRows.length}条`;$('csv-link').href='data:text/csv;charset=utf-8,'+encodeURIComponent('\uFEFF'+text);$('csv-link').download=`赋能产业-${page}-${region||'全国样本'}.csv`;$('export-dialog').showModal()};
$('export-close').onclick=()=>$('export-dialog').close();
render();
</script></body></html>
